name: Backend CI

# Run on every push to main and on every pull request targeting main.
# The paths filter avoids running this job when only frontend files change.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  quality:
    runs-on: ubuntu-latest
    # All run steps execute inside ./backend, where pyproject.toml lives.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Installs uv and caches its downloads between runs.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the exact Python version declared in requires-python / .python-version.
      - run: uv python install 3.10

      # --frozen: fail if uv.lock does not match pyproject.toml (reproducibility).
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - uses: actions/cache@v4
        with:
          path: backend/data
          # Keep in sync with _KERNEL_FILE in skyfield_provider.py
          key: ephemeris-de440s
      - run: uv run pytest
  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t solar-system-backend ./backend

      # Smoke test: the container must start (kernel loaded) and answer.
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 solar-system-backend
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break || sleep 2
          done
          curl -fs "http://localhost:8000/api/v1/positions?date=2000-01-01T12:00:00Z" | head -c 300
          docker logs api