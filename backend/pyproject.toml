[project]
name = "backend"
version = "0.1.0"
description = "Backend del simulador del sistema solar"
readme = "README.md"
authors = [
    { name = "Matute0512", email = "matiast999@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "skyfield>=1.55",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.build-backend]
module-name = "solar_system"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "astroquery>=0.4.11",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
# Define el estilo y reglas de linting
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
# Configuración de chequeo de tipos
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Configuración de pytest
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
python_files = ["test_*.py"]
